name: Windows 설치 파일 빌드

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "설치 파일을 올릴 릴리스 태그 (예: v3.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 헬퍼 exe 2개(csc + MSVC) 컴파일 후 NSIS 설치 파일 생성
      - run: npm run build:win -- --publish never

      - name: 릴리스에 업로드
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "dist/Accord Windows x64 Setup.exe" --clobber
