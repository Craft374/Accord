<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="../../public/styles.css" />
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #11151b; color: #e7ebf2; }
    #memoEditor { width: 720px; height: 520px; }
  </style>
</head>
<body>
  <div id="memoEditor" class="memo-editor"></div>
  <script src="../../public/memo-editor.bundle.js"></script>
  <script>
    window.memoChanges = [];
    window.memoSelections = [];
    window.memoOpenedLinks = [];
    // public/app.js 전체를 로드하지 않고, 라이브 모드가 브릿지를 올바르게 호출하는지만 확인하는 가벼운 스텁.
    window.AccordMemoRender = {
      tokens: (code, lang) => {
        if (lang !== "js") return [];
        const idx = code.indexOf("return");
        return idx < 0 ? [] : [{ from: idx, to: idx + 6, cls: "keyword" }];
      },
      table: (rows) => `<table class="md-table" data-rows="${rows.length}"><tbody><tr><td>stub</td></tr></tbody></table>`,
    };
    window.memoEditor = window.AccordMemoEditor.create({
      parent: document.querySelector("#memoEditor"),
      onChange: (text) => window.memoChanges.push(text),
      onSelectionChange: (selection) => window.memoSelections.push(selection),
      onOpenLink: (href) => window.memoOpenedLinks.push(href),
    });
    window.memoEditor.setReadOnly(false);
  </script>
</body>
</html>
